name: "Propose a benchmark or results source"
description: "A benchmark, leaderboard or dataset whose results we could add."
labels: ["data", "source", "new-benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        A maintainer can run the local contribution reviewer to prepare a report and proposed data changes. Nothing is merged automatically. Include exact source links so the measurements and licence can be reviewed. A new source is never approved automatically; its licence must be reviewed before any results are imported.

        The licence has to cover the results themselves, not just the code. Leaderboard aggregators (Artificial Analysis, OpenRouter, the arena.ai website) can't be used.
  - type: input
    id: name
    attributes:
      label: "Benchmark or source name"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: "Link to the results"
      description: "The paper, dataset or results file itself, e.g. https://arxiv.org/abs/2501.12345v2 or a Hugging Face dataset."
    validations:
      required: true
  - type: dropdown
    id: licence
    attributes:
      label: "Licence of the results"
      description: "The licence has to cover the numbers themselves, not just the code."
      options:
        - "CC BY"
        - "CC BY-SA"
        - "CC0"
        - "Apache-2.0"
        - "MIT"
        - "Other or not sure"
    validations:
      required: true
  - type: input
    id: licence_link
    attributes:
      label: "Link to the licence or terms"
  - type: dropdown
    id: category
    attributes:
      label: "Category"
      options:
        - "Text (LLM)"
        - "Image"
        - "Video"
        - "Text-to-speech"
        - "Speech-to-text"
    validations:
      required: true
  - type: dropdown
    id: scale
    attributes:
      label: "Score type"
      options:
        - "Accuracy or percentage (higher is better)"
        - "Error rate (lower is better)"
        - "Elo or arena rating"
    validations:
      required: true
  - type: textarea
    id: measures
    attributes:
      label: "What it measures and which models it covers"
    validations:
      required: true
