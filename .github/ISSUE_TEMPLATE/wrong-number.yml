name: "Correct a benchmark score"
description: "Correct a published test result we already list."
title: "Correct a benchmark score"
labels: ["data", "wrong-number"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below; no special text format is needed. A maintainer reviews the reference before updating the site. For several changes, you can also [edit the data and open a pull request](https://github.com/jakemanger/whatmodel/blob/main/CONTRIBUTING.md).
  - type: input
    id: model
    attributes:
      label: "Model"
      description: "The model id from its page, for example qwen3-8b. Prefilled when opened from the site."
    validations:
      required: true
  - type: input
    id: benchmark
    attributes:
      label: "Benchmark"
      description: "Exact benchmark id shown on the site."
    validations:
      required: true
  - type: input
    id: before
    attributes:
      label: "Current score"
  - type: input
    id: score
    attributes:
      label: "Correct score"
      description: "Include % for percentages, e.g. 71.2%. Otherwise use the source's numeric scale."
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Reference URL"
      description: "The paper, model card or provider page that supports the proposed value."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "Notes (optional)"
      description: "Table/page, evaluation settings, or anything needed to interpret the reference."
