name: "Add a test result"
description: "This model scored this value on this benchmark, according to this source."
title: "Add a test result"
labels: ["data", "paper-results"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below; no special text format is needed. A maintainer reviews the reference before updating the site. For several changes, you can also [edit the data and open a pull request](https://github.com/jakemanger/whatmodel/blob/main/CONTRIBUTING.md).
  - type: input
    id: model
    attributes:
      label: "Model"
      description: "The model id from its page, for example qwen3-8b. Prefilled when opened from the site."
    validations:
      required: true
  - type: input
    id: benchmark
    attributes:
      label: "Benchmark"
      description: "Use the benchmark id; the model page can prefill it."
    validations:
      required: true
  - type: input
    id: score
    attributes:
      label: "Score"
      description: "Include % for percentages, e.g. 71.2%. Otherwise use the source's numeric scale."
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Reference URL"
      description: "The paper, model card or provider page that supports the proposed value."
    validations:
      required: true
  - type: dropdown
    id: by
    attributes:
      label: "Who ran the evaluation? (optional)"
      options:
        - "The source's authors, on models they didn't make"
        - "The model's own makers"
        - "Not sure"
  - type: textarea
    id: notes
    attributes:
      label: "Notes (optional)"
      description: "Table/page, evaluation settings, or anything needed to interpret the reference."
