name: "Update model information"
description: "Correct one fact with a before/after value and reference."
title: "Update model information"
labels: ["data", "update-model"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below; no special text format is needed. A maintainer reviews the reference before updating the site. For several changes, you can also [edit the data and open a pull request](https://github.com/jakemanger/whatmodel/blob/main/CONTRIBUTING.md).
  - type: input
    id: model
    attributes:
      label: "Model"
      description: "The model id from its page, for example qwen3-8b. Prefilled when opened from the site."
    validations:
      required: true
  - type: input
    id: what
    attributes:
      label: "Field to change"
      description: "Prefilled by the model page. Choose a field there, or use: Name; Maker; Release date (YYYY-MM); Weights licence; Total parameters (B); Active parameters (B); Context window (k tokens); Downloadable weights (yes/no); Input price (USD / 1M tokens); Output price (USD / 1M tokens); Price (USD / category unit)"
    validations:
      required: true
  - type: input
    id: before
    attributes:
      label: "Current value"
      description: "Prefilled by the model page. Leave blank if you do not know it."
  - type: input
    id: after
    attributes:
      label: "Correct value"
      description: "Use the units shown in Field to change. Enter only the value."
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Reference URL"
      description: "The paper, model card or provider page that supports the proposed value."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "Notes (optional)"
      description: "Table/page, evaluation settings, or anything needed to interpret the reference."
