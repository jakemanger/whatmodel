name: "Update model information"
description: "Edit the prefilled information and add a supporting reference."
title: "Update model information"
labels: ["data", "update-model"]
body:
  - type: markdown
    attributes:
      value: |
        Edit the Updated information below and add a reference. The Current information stays as the before copy for comparison.
  - type: input
    id: model
    attributes:
      label: "Model"
      description: "The model id from its page, for example qwen3-8b. Prefilled when opened from the site."
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: "Current information"
      description: "Prefilled for comparison. Leave this copy unchanged."
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: "Updated information"
      description: "The same information is prefilled here. Edit the values you want to change; keep the field names and other lines."
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Reference URL"
      description: "The paper, model card or provider page that supports the proposed value."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "Notes (optional)"
      description: "Table/page, evaluation settings, or anything needed to interpret the reference."
