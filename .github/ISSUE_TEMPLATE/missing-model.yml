name: "Add a missing model"
description: "Suggest a model by name and official reference."
title: "Add a missing model"
labels: ["data", "missing-model"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below; no special text format is needed. A maintainer reviews the reference before updating the site. For several changes, you can also [edit the data and open a pull request](https://github.com/jakemanger/whatmodel/blob/main/CONTRIBUTING.md).
  - type: input
    id: model
    attributes:
      label: "Model name"
    validations:
      required: true
  - type: input
    id: links
    attributes:
      label: "Official reference URL"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: "Category (optional)"
      options:
        - "Text (LLM)"
        - "Image"
        - "Video"
        - "Text-to-speech"
        - "Speech-to-text"
  - type: input
    id: maker
    attributes:
      label: "Maker (optional)"
  - type: dropdown
    id: weights
    attributes:
      label: "Are the weights downloadable? (optional)"
      options:
        - "Yes"
        - "No"
        - "Not sure"
  - type: textarea
    id: notes
    attributes:
      label: "Notes (optional)"
      description: "Table/page, evaluation settings, or anything needed to interpret the reference."
